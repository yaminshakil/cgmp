<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#eaf4fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11558d"/>
      <stop offset="100%" stop-color="#0a2d4d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- scattered airborne particles, fading as they approach the shield -->
  <g fill="#57ad32" opacity="0.55">
    <circle cx="90" cy="120" r="5"/>
    <circle cx="140" cy="200" r="4"/>
    <circle cx="70" cy="280" r="6"/>
    <circle cx="150" cy="330" r="3.5"/>
    <circle cx="200" cy="110" r="4.5"/>
  </g>
  <g fill="#11558d" opacity="0.35">
    <circle cx="240" cy="180" r="4"/>
    <circle cx="260" cy="260" r="3"/>
    <circle cx="280" cy="330" r="4"/>
  </g>

  <!-- protective arc / breath shield -->
  <path d="M 300 60 A 240 240 0 0 1 300 390" fill="none" stroke="#57ad32" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.7"/>
  <path d="M 330 30 A 300 300 0 0 1 330 420" fill="none" stroke="#11558d" stroke-width="2.5" stroke-dasharray="2 16" stroke-linecap="round" opacity="0.4"/>

  <!-- central badge -->
  <circle cx="560" cy="225" r="150" fill="url(#badgeGrad)"/>
  <circle cx="560" cy="225" r="150" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>

  <!-- minimal face-in-mask icon -->
  <g transform="translate(560 225)">
    <!-- head -->
    <path d="M -46 -55 Q 0 -95 46 -55 L 46 5 Q 46 45 0 55 Q -46 45 -46 5 Z" fill="#eaf4fc" opacity="0.95"/>
    <!-- eyes -->
    <circle cx="-18" cy="-30" r="5" fill="#0a2d4d"/>
    <circle cx="18" cy="-30" r="5" fill="#0a2d4d"/>
    <!-- mask -->
    <path d="M -46 0 Q 0 -18 46 0 L 46 8 Q 0 34 -46 8 Z" fill="#57ad32"/>
    <path d="M -46 4 Q 0 -14 46 4" fill="none" stroke="#3f8322" stroke-width="2" opacity="0.7"/>
    <path d="M -46 14 Q 0 -4 46 14" fill="none" stroke="#3f8322" stroke-width="2" opacity="0.5"/>
    <!-- ear loop hint -->
    <path d="M -46 -6 Q -66 4 -50 22" fill="none" stroke="#3f8322" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- gentle breath waves top right -->
  <g stroke="#ffffff" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M 660 90 Q 690 75 720 90 T 780 90"/>
    <path d="M 650 110 Q 680 98 710 110 T 770 110"/>
  </g>
</svg>
