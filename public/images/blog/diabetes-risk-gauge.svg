<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#f1f9e9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11558d"/>
      <stop offset="100%" stop-color="#0a2d4d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- dot grid decoration -->
  <g fill="#57ad32" opacity="0.18">
    <circle cx="60" cy="60" r="3"/><circle cx="90" cy="60" r="3"/><circle cx="120" cy="60" r="3"/>
    <circle cx="60" cy="90" r="3"/><circle cx="90" cy="90" r="3"/><circle cx="120" cy="90" r="3"/>
    <circle cx="60" cy="120" r="3"/><circle cx="90" cy="120" r="3"/><circle cx="120" cy="120" r="3"/>
  </g>

  <!-- risk gauge -->
  <g transform="translate(300 260)">
    <path d="M -170 0 A 170 170 0 0 1 170 0" fill="none" stroke="#eaf4fc" stroke-width="26" stroke-linecap="round"/>
    <path d="M -170 0 A 170 170 0 0 1 -40 -166" fill="none" stroke="#57ad32" stroke-width="26" stroke-linecap="round"/>
    <path d="M -40 -166 A 170 170 0 0 1 95 -142" fill="none" stroke="#f2b134" stroke-width="26" stroke-linecap="round"/>
    <path d="M 95 -142 A 170 170 0 0 1 170 0" fill="none" stroke="#d9534f" stroke-width="26" stroke-linecap="round"/>

    <!-- needle pointing to mid-risk -->
    <g transform="rotate(-25)">
      <path d="M 0 0 L -6 0 L 0 -140 L 6 0 Z" fill="#0a2d4d"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="#0a2d4d"/>
    <circle cx="0" cy="0" r="6" fill="#eaf4fc"/>

    <text x="-160" y="34" font-family="Arial, sans-serif" font-size="15" fill="#3f8322" font-weight="700">LOW</text>
    <text x="128" y="34" font-family="Arial, sans-serif" font-size="15" fill="#c0392b" font-weight="700">HIGH</text>
  </g>

  <!-- blood drop with pulse line, overlapping gauge -->
  <g transform="translate(560 190)">
    <path d="M 0 -95 C 55 -25 90 25 90 65 C 90 118 48 150 0 150 C -48 150 -90 118 -90 65 C -90 25 -55 -25 0 -95 Z" fill="url(#dropGrad)"/>
    <path d="M -60 55 L -25 55 L -8 20 L 12 90 L 30 55 L 60 55" fill="none" stroke="#eaf4fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating percentage badge -->
  <g transform="translate(690 300)">
    <circle r="46" fill="#ffffff" stroke="#57ad32" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0a2d4d">?%</text>
  </g>
</svg>
